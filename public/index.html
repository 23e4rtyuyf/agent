<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Response Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="mx-auto max-w-7xl px-4 py-6">
      <header class="mb-4 rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 p-4 shadow-xl">
        <h1 class="text-xl font-bold">Missed Call Revenue Recovery</h1>
        <p class="text-sm text-white/90">Live lead engagement dashboard</p>
        <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
          <div class="rounded-lg bg-black/25 p-3">
            <p class="uppercase tracking-wide text-white/80">Total Missed Calls</p>
            <p id="totalMissed" class="text-2xl font-semibold">0</p>
          </div>
          <div class="rounded-lg bg-black/25 p-3">
            <p class="uppercase tracking-wide text-white/80">Active Conversations</p>
            <p id="activeConversations" class="text-2xl font-semibold">0</p>
          </div>
        </div>
      </header>

      <main class="grid grid-cols-1 gap-4 md:grid-cols-12">
        <aside class="md:col-span-4 rounded-xl border border-slate-800 bg-slate-900">
          <div class="border-b border-slate-800 px-4 py-3">
            <h2 class="font-semibold">Leads</h2>
          </div>
          <ul id="leadList" class="max-h-[70vh] overflow-y-auto"></ul>
        </aside>

        <section class="md:col-span-8 rounded-xl border border-slate-800 bg-slate-900">
          <div id="conversationHeader" class="border-b border-slate-800 px-4 py-3 text-sm text-slate-300">
            Select a lead to view conversation history.
          </div>
          <div id="conversation" class="max-h-[70vh] space-y-3 overflow-y-auto p-4"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
